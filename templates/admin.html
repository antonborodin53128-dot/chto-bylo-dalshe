<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Ведущий</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
.qr-card{margin-top:18px;padding:18px;background:#19191b;border:1px solid #333;border-radius:16px;text-align:center}
.qr-title{font-size:22px;font-weight:900;margin-bottom:6px}
.qr-sub{color:#aaa;margin-bottom:14px}
#qrcode{display:inline-block;background:#fff;padding:12px;border-radius:12px}
#qrcode img,#qrcode canvas{display:block}
.qr-url{margin-top:10px;color:#ffd21c;font-weight:700;word-break:break-all}
</style>
</head><body><div class="w"><div class="y">ПАНЕЛЬ ВЕДУЩЕГО</div><div class="c"><select id="sel" onchange="rnd()"></select><button id="tog" onclick="act('toggle')"></button><button onclick="reset()">СБРОСИТЬ ИГРУ</button>
<button onclick="toggleQR()" id="qrButton">ПОКАЗАТЬ QR-КОД</button><h1 id="q"></h1><p id="m" class="muted"></p></div><div class="c"><h2>Результаты</h2><div id="res"></div></div><div class="c"><h2>Таблица лидеров</h2><div id="lead"></div></div></div><script>
for(let i=1;i<=7;i++)sel.add(new Option("Раунд "+i,i));async function act(a,e={}){await fetch("/api/admin/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:a,...e})});load()}function rnd(){act("round",{round:+sel.value})}function reset(){if(confirm("Удалить участников, голоса и очки?"))act("reset")}
async function load(){let d=await(await fetch("/api/admin")).json();sel.value=d.round;q.textContent=d.question;tog.textContent=d.open?"ЗАКРЫТЬ ГОЛОСОВАНИЕ":"ОТКРЫТЬ ГОЛОСОВАНИЕ";m.textContent="Участников: "+d.players+" · Проголосовало: "+d.voted;let t=Math.max(1,d.voted);res.innerHTML=d.answers.map((x,i)=>`<p><b>${["А","Б","В","Г"][i]}: ${d.counts[i]} — ${Math.round(d.counts[i]*100/t)}%</b> <span class="muted">${x}</span></p><div class="bar"><div class="fill" style="width:${d.counts[i]*100/t}%"></div></div>`).join("");lead.innerHTML=d.leaders.length?"<table>"+d.leaders.map((x,i)=>`<tr><td>${i+1}. ${x.name}</td><td><b>${x.score}</b></td></tr>`).join("")+"</table>":"<span class=muted>Пока нет участников</span>"}setInterval(load,1000);load()</script><div class="qr-card" id="qrCard" style="display:none">
  <div class="qr-title">QR-КОД ДЛЯ УЧАСТНИКОВ</div>
  <div class="qr-sub">Отсканируйте камерой телефона и войдите в игру</div>
  <div id="qrcode"></div>
  <div class="qr-url" id="qrurl"></div>
</div>

<script>
function toggleQR(){
  const card=document.getElementById("qrCard");
  const btn=document.getElementById("qrButton");
  const show=card.style.display==="none";
  card.style.display=show?"block":"none";
  btn.textContent=show?"СКРЫТЬ QR-КОД":"ПОКАЗАТЬ QR-КОД";
}
(function(){
  const participantUrl = window.location.origin + "/";
  document.getElementById("qrurl").textContent = participantUrl;
  if (window.QRCode) {
    new QRCode(document.getElementById("qrcode"), {
      text: participantUrl,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    document.getElementById("qrcode").textContent = "QR-код не загрузился";
  }
})();
</script>

<div class="c" style="margin-top:18px">
  <div class="y">POWERPOINT REMOTE</div>
  <p class="muted">Код показывается в программе Presentation Remote на ноутбуке.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <input id="pptCode" inputmode="numeric" maxlength="6" placeholder="КОД 000000"
      style="font-size:22px;font-weight:900;letter-spacing:4px;max-width:190px;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff">
    <button onclick="savePptCode()">ПОДКЛЮЧИТЬ</button>
  </div>
  <p id="pptStatus" class="muted">Пульт не подключён</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
    <button onclick="ppt('prev')" style="font-size:22px;min-height:70px">← НАЗАД</button>
    <button onclick="ppt('next')" style="font-size:22px;min-height:70px">ВПЕРЁД →</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px">
    <button onclick="ppt('start')">▶ ЗАПУСТИТЬ</button>
    <button onclick="ppt('black')">■ ЧЁРНЫЙ ЭКРАН</button>
    <button onclick="ppt('end')">ESC ЗАВЕРШИТЬ</button>
  </div>
</div>
<script>
const pptCode=document.getElementById("pptCode"), pptStatus=document.getElementById("pptStatus");
pptCode.value=localStorage.getItem("pptRemoteCode")||"";
function savePptCode(){localStorage.setItem("pptRemoteCode",pptCode.value.trim());pptStatus.textContent="Проверяю соединение…";pptCheck()}
async function ppt(command){
 const code=(pptCode.value||"").trim();
 if(code.length!==6){pptStatus.textContent="Введите 6-значный код из программы";return}
 const r=await fetch("/api/ppt/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,command})});
 if(!r.ok)pptStatus.textContent="Пульт не подключён";
}
async function pptCheck(){
 const code=(pptCode.value||"").trim(); if(code.length!==6)return;
 try{
  const d=await(await fetch("/api/ppt/status?code="+encodeURIComponent(code)+"&_="+Date.now(),{cache:"no-store"})).json();
  if(d.connected){
   pptStatus.textContent="● ПОДКЛЮЧЕНО"+(d.name?" · "+d.name:"")+(d.total?" · Слайд "+d.slide+" / "+d.total:"");
  }else pptStatus.textContent="Пульт не подключён";
 }catch(e){pptStatus.textContent="Нет связи с сервером"}
}
setInterval(pptCheck,1500);pptCheck();
</script>

</body></html>
