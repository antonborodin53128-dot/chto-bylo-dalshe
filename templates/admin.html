<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Ведущий</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
.qr-card{margin-top:18px;padding:18px;background:#19191b;border:1px solid #333;border-radius:16px;text-align:center}
.qr-title{font-size:22px;font-weight:900;margin-bottom:6px}
.qr-sub{color:#aaa;margin-bottom:14px}
#qrcode{display:inline-block;background:#fff;padding:12px;border-radius:12px}
#qrcode img,#qrcode canvas{display:block}
.qr-url{margin-top:10px;color:#ffd21c;font-weight:700;word-break:break-all}
.remote{margin-top:18px;padding-top:16px;border-top:1px solid #333}.remote-row{display:flex;gap:8px;flex-wrap:wrap}.remote-row input{flex:1;min-width:140px;padding:11px;background:#111;color:#fff;border:1px solid #555;border-radius:9px}.remote-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.remote-nav button{font-weight:900;padding:15px 8px}.remote-status{color:#aaa;font-weight:800;margin-top:9px}</style>
</head><body><div class="w"><div class="y">ПАНЕЛЬ ВЕДУЩЕГО</div><div class="c"><select id="sel" onchange="rnd()"></select><button id="tog" onclick="act('toggle')"></button><button onclick="reset()">СБРОСИТЬ ИГРУ</button>
<button onclick="toggleQR()" id="qrButton">ПОКАЗАТЬ QR-КОД</button><h1 id="q"></h1><p id="m" class="muted"></p><div class="remote"><div class="remote-row"><input id="pptLogin" placeholder="Логин пульта"><button onclick="savePptLogin()">ПОДКЛЮЧИТЬ</button><button onclick="resetPptLogin()">СБРОСИТЬ ЛОГИН</button></div><div id="pptStatus" class="remote-status">ПУЛЬТЫ: логин не задан</div><div class="remote-nav"><button onclick="ppt('prev')">← ПРЕДЫДУЩИЙ СЛАЙД</button><button onclick="ppt('next')">СЛЕДУЮЩИЙ СЛАЙД →</button></div></div></div><div class="c"><h2>Результаты</h2><div id="res"></div></div><div class="c"><h2>Таблица лидеров</h2><div id="lead"></div></div></div><script>
for(let i=1;i<=7;i++)sel.add(new Option("Раунд "+i,i));async function act(a,e={}){await fetch("/api/admin/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:a,...e})});load()}function rnd(){act("round",{round:+sel.value})}function reset(){if(confirm("Удалить участников, голоса и очки?"))act("reset")}
async function load(){let d=await(await fetch("/api/admin")).json();sel.value=d.round;q.textContent=d.question;tog.textContent=d.open?"ЗАКРЫТЬ ГОЛОСОВАНИЕ":"ОТКРЫТЬ ГОЛОСОВАНИЕ";m.textContent="Участников: "+d.players+" · Проголосовало: "+d.voted;let t=Math.max(1,d.voted);res.innerHTML=d.answers.map((x,i)=>`<p><b>${["А","Б","В","Г"][i]}: ${d.counts[i]} — ${Math.round(d.counts[i]*100/t)}%</b> <span class="muted">${x}</span></p><div class="bar"><div class="fill" style="width:${d.counts[i]*100/t}%"></div></div>`).join("");lead.innerHTML=d.leaders.length?"<table>"+d.leaders.map((x,i)=>`<tr><td>${i+1}. ${x.name}</td><td><b>${x.score}</b></td></tr>`).join("")+"</table>":"<span class=muted>Пока нет участников</span>"}setInterval(load,1000);load()</script><div class="qr-card" id="qrCard" style="display:none">
  <div class="qr-title">QR-КОД ДЛЯ УЧАСТНИКОВ</div>
  <div class="qr-sub">Отсканируйте камерой телефона и войдите в игру</div>
  <div id="qrcode"></div>
  <div class="qr-url" id="qrurl"></div>
</div>

<script>
function toggleQR(){
  const card=document.getElementById("qrCard");
  const btn=document.getElementById("qrButton");
  const show=card.style.display==="none";
  card.style.display=show?"block":"none";
  btn.textContent=show?"СКРЫТЬ QR-КОД":"ПОКАЗАТЬ QR-КОД";
}
(function(){
  const participantUrl = window.location.origin + "/";
  document.getElementById("qrurl").textContent = participantUrl;
  if (window.QRCode) {
    new QRCode(document.getElementById("qrcode"), {
      text: participantUrl,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    document.getElementById("qrcode").textContent = "QR-код не загрузился";
  }
})();
</script>

<script>
const pptLogin=document.getElementById("pptLogin");
const pptStatus=document.getElementById("pptStatus");
pptLogin.value=localStorage.getItem("pptLogin")||"";
let activePptLogin=cleanLogin(pptLogin.value);
let pptRemoteId=localStorage.getItem("pptAdminRemoteId")||"";
if(!pptRemoteId){pptRemoteId="admin-"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random());localStorage.setItem("pptAdminRemoteId",pptRemoteId)}
function cleanLogin(v){return (v||"").trim().toLowerCase().replace(/[^a-zа-яё0-9_-]/gi,"").slice(0,40)}
function savePptLogin(){
 const login=cleanLogin(pptLogin.value);pptLogin.value=login;
 if(!login)return;
 activePptLogin=login;localStorage.setItem("pptLogin",login);
 pptHeartbeat();pptStatusUpdate();
}
function resetPptLogin(){
 activePptLogin="";localStorage.removeItem("pptLogin");pptLogin.value="";
 pptStatus.textContent="ПУЛЬТЫ: логин не задан";
}
async function ppt(command){
 const login=activePptLogin;
 if(!login){alert("Введите логин пульта и нажмите ПОДКЛЮЧИТЬ");return}
 try{await fetch("/api/presentation/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login,command})})}catch(e){}
}
async function pptHeartbeat(){
 const login=activePptLogin;if(!login)return;
 try{await fetch("/api/presentation/remote-heartbeat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login,remote_id:pptRemoteId})})}catch(e){}
}
async function pptStatusUpdate(){
 const login=activePptLogin;
 if(!login){pptStatus.textContent="ПУЛЬТЫ: логин не задан";return}
 try{
  const r=await fetch("/api/presentation/status?login="+encodeURIComponent(login),{cache:"no-store"});
  const d=await r.json();
  if(!r.ok)throw new Error();
  pptStatus.textContent=d.online>0?"● ПУЛЬТ ПОДКЛЮЧЕН · "+login.toUpperCase():"○ ПУЛЬТ НЕ ПОДКЛЮЧЕН · "+login.toUpperCase();
  pptStatus.style.color=d.online>0?"#52d273":"#aaa";
 }catch(e){pptStatus.textContent="ПУЛЬТЫ: связь с сервером…";pptStatus.style.color="#aaa"}
}
setInterval(pptHeartbeat,3000);setInterval(pptStatusUpdate,1500);pptHeartbeat();pptStatusUpdate();
</script>
</body></html>
