<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Ведущий</title></head><body><div class="w"><div class="y">ПАНЕЛЬ ВЕДУЩЕГО</div><div class="c"><select id="sel" onchange="rnd()"></select><button id="tog" onclick="act('toggle')"></button><button onclick="reset()">СБРОСИТЬ ИГРУ</button><h1 id="q"></h1><p id="m" class="muted"></p></div><div class="c"><h2>Результаты</h2><div id="res"></div></div><div class="c"><h2>Таблица лидеров</h2><div id="lead"></div></div></div><script>
for(let i=1;i<=7;i++)sel.add(new Option("Раунд "+i,i));async function act(a,e={}){await fetch("/api/admin/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:a,...e})});load()}function rnd(){act("round",{round:+sel.value})}function reset(){if(confirm("Удалить участников, голоса и очки?"))act("reset")}
async function load(){let d=await(await fetch("/api/admin")).json();sel.value=d.round;q.textContent=d.question;tog.textContent=d.open?"ЗАКРЫТЬ ГОЛОСОВАНИЕ":"ОТКРЫТЬ ГОЛОСОВАНИЕ";m.textContent="Участников: "+d.players+" · Проголосовало: "+d.voted;let t=Math.max(1,d.voted);res.innerHTML=d.answers.map((x,i)=>`<p><b>${["А","Б","В","Г"][i]}: ${d.counts[i]} — ${Math.round(d.counts[i]*100/t)}%</b> <span class="muted">${x}</span></p><div class="bar"><div class="fill" style="width:${d.counts[i]*100/t}%"></div></div>`).join("");lead.innerHTML=d.leaders.length?"<table>"+d.leaders.map((x,i)=>`<tr><td>${i+1}. ${x.name}</td><td><b>${x.score}</b></td></tr>`).join("")+"</table>":"<span class=muted>Пока нет участников</span>"}setInterval(load,1000);load()</script></body></html>
