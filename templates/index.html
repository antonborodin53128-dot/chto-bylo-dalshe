<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Что было дальше?</title></head><body><div class="w"><div class="y">ЧТО БЫЛО ДАЛЬШЕ?</div><div id="j" class="c"><h1>Введи имя</h1><input id="n" placeholder="Имя или ник"><button onclick="join()">ВОЙТИ</button></div><div id="g" class="c hide"><div id="r" class="y"></div><h1 id="q"></h1><p id="s" class="muted"></p><div id="aa"></div></div></div><script>
let d=localStorage.d||crypto.randomUUID();localStorage.d=d;
let name=localStorage.n||"";
let mySession=localStorage.gameSession||"";
function showJoin(){name="";localStorage.removeItem("n");localStorage.removeItem("gameSession");j.classList.remove("hide");g.classList.add("hide");n.value=""}
function showGame(){j.classList.add("hide");g.classList.remove("hide")}
async function join(){
 name=n.value.trim();if(!name)return;
 let x=await fetch("/api/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:d,name})});
 if(!x.ok)return alert("Не удалось войти в игру");
 let z=await x.json();mySession=z.session;localStorage.n=name;localStorage.gameSession=mySession;showGame();load();
}
async function vote(i){let x=await fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:d,choice:i})});let z=await x.json();if(!x.ok)alert(z.error||"Ошибка");load()}
async function load(){
 try{
  let x=await(await fetch("/api/state?device="+encodeURIComponent(d),{cache:"no-store"})).json();
  // Новый session UUID означает, что ведущий нажал «Сбросить игру».
  // Старая регистрация на телефоне больше не действует.
  if(mySession!==x.session || !x.registered){if(name||mySession)showJoin();return;}
  if(!name){showJoin();return;}
  showGame();r.textContent="РАУНД "+x.round;q.textContent=x.question;s.textContent=x.voted?"Ответ принят ✓":x.open?"Голосование открыто":"Ждём ведущего…";aa.innerHTML="";
  if(x.open&&!x.voted)x.answers.forEach((t,i)=>{let b=document.createElement("button");b.className="a";b.textContent=["А","Б","В","Г"][i]+"  "+t;b.onclick=()=>vote(i);aa.appendChild(b)})
 }catch(e){}
}
if(name&&mySession)showGame();else showJoin();setInterval(load,1500);load();
</script></body></html>
