<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Что было дальше?</title></head><body><div class="w"><div class="y">ЧТО БЫЛО ДАЛЬШЕ?</div><div id="j" class="c"><h1>Введи имя</h1><input id="n" placeholder="Имя или ник"><button onclick="join()">ВОЙТИ</button></div><div id="g" class="c hide"><div id="r" class="y"></div><h1 id="q"></h1><p id="s" class="muted"></p><div id="aa"></div></div></div><script>
let d=localStorage.d||crypto.randomUUID();localStorage.d=d;let name=localStorage.n||"";if(name){j.classList.add("hide");g.classList.remove("hide")}
async function join(){name=n.value.trim();if(!name)return;await fetch("/api/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:d,name})});localStorage.n=name;j.classList.add("hide");g.classList.remove("hide");load()}
async function vote(i){let x=await fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:d,choice:i})});let z=await x.json();if(!x.ok)alert(z.error||"Ошибка");load()}
async function load(){if(!name)return;await fetch("/api/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:d,name})});let x=await(await fetch("/api/state?device="+encodeURIComponent(d))).json();r.textContent="РАУНД "+x.round;q.textContent=x.question;s.textContent=x.voted?"Ответ принят ✓":x.open?"Голосование открыто":"Ждём ведущего…";aa.innerHTML="";if(x.open&&!x.voted)x.answers.forEach((t,i)=>{let b=document.createElement("button");b.className="a";b.textContent=["А","Б","В","Г"][i]+"  "+t;b.onclick=()=>vote(i);aa.appendChild(b)})}setInterval(load,1500);load()</script></body></html>
