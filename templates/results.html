<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
<title>Таблица лидеров</title>
<style>
html,body{min-height:100%;overflow:auto}
.w{max-width:1400px;padding:32px 48px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
.title{font-size:clamp(34px,5vw,76px);font-weight:900;line-height:1;margin:10px 0}
.round{font-size:clamp(18px,2vw,30px);color:#aaa;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px 24px}
.player{display:grid;grid-template-columns:70px 1fr 100px;align-items:center;min-height:58px;padding:8px 16px;background:#19191b;border:1px solid #333;border-radius:13px}
.place{font-size:26px;font-weight:900;color:#ffd21c}
.name{font-size:clamp(18px,2vw,28px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{text-align:right;font-size:clamp(18px,2vw,28px);font-weight:900}
.empty{font-size:28px;color:#aaa;padding:50px 0}
@media(max-width:700px){.w{padding:20px}.grid{grid-template-columns:1fr}.player{grid-template-columns:55px 1fr 75px}}
</style>
</head>
<body>
<div class="w">
  <div class="head">
    <div><div class="y">ЧТО БЫЛО ДАЛЬШЕ?</div><div class="title">ТАБЛИЦА ЛИДЕРОВ</div></div>
    <div id="round" class="round"></div>
  </div>
  <div id="players" class="grid"></div>
</div>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function load(){
  try{
    const d=await (await fetch("/api/admin",{cache:"no-store"})).json();
    document.getElementById("round").textContent="ПОСЛЕ РАУНДА "+d.round;
    const box=document.getElementById("players");
    if(!d.leaders.length){box.innerHTML='<div class="empty">Участники пока не подключились</div>';return}
    let prevScore=null, place=0;
    box.innerHTML=d.leaders.map((x,i)=>{
      if(x.score!==prevScore){place=i+1;prevScore=x.score}
      return `<div class="player"><div class="place">${place}</div><div class="name">${esc(x.name)}</div><div class="score">${x.score} <span style="color:#777;font-size:.55em">БАЛЛ.</span></div></div>`
    }).join("");
  }catch(e){}
}
setInterval(load,1000);load();
</script>
</body></html>
