<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Что было дальше? — Экран</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}.slide{position:relative;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);overflow:hidden;background:#000}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.vid{position:absolute;object-fit:contain;background:#000}.hint{position:fixed;right:12px;bottom:8px;color:#555;font:12px Arial;opacity:.35}.startText{position:absolute;z-index:20;left:30.9%;top:59.7%;width:38.2%;height:19.9%;border:2px solid #ffd400;border-radius:20px;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;pointer-events:none}.startText .main{font:900 clamp(30px,4.3vw,84px)/.95 Arial,sans-serif;color:#f4f4f4;letter-spacing:-1px}.startText .main b{color:#ffd400}.startText .sub{margin-top:8px;font:700 clamp(14px,1.45vw,28px)/1 Arial,sans-serif;color:#8d8d8d}.hidden{visibility:hidden}
</style></head><body><div id="stage"><div class="slide" id="slide"><img class="bg" id="bg"></div></div><div class="hint" id="hint"></div>
<script>
const TOTAL=40, ANSWER_SLIDES=new Set([9,14,19,24,29,34,39]), TIMER_SLIDES=new Set([7,12,17,22,27,32,37]);
let current=0,map={},preloadStarted=false,preloadDone=false;
const cacheImgs=[], cacheVids=[];
function pad(n){return String(n).padStart(2,'0')}
function reportPreload(done,total){fetch('/api/presentation/preload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({done,total})}).catch(()=>{})}
async function preloadAll(){if(preloadStarted)return;preloadStarted=true;const urls=[];for(let i=1;i<=TOTAL;i++)urls.push({type:'img',src:'/static/presentation/slides/slide-'+pad(i)+'.jpg'});const media=new Set();Object.values(map).flat().forEach(m=>media.add(m.src));media.add('/static/presentation/media/media18.mp4');media.add('/static/presentation/media/media19.mp4');for(const src of media)urls.push({type:'video',src});let done=0;reportPreload(0,urls.length);
 await Promise.all(urls.map(item=>new Promise(resolve=>{let el;if(item.type==='img'){el=new Image();cacheImgs.push(el);el.onload=el.onerror=finish}else{el=document.createElement('video');cacheVids.push(el);el.preload='auto';el.muted=true;el.playsInline=true;el.oncanplaythrough=finish;el.onerror=finish;setTimeout(finish,15000)}let finished=false;function finish(){if(finished)return;finished=true;done++;reportPreload(done,urls.length);resolve()}el.src=item.src;if(item.type==='video')el.load()})));preloadDone=true}
function clearMedia(){const box=document.getElementById('slide');box.querySelectorAll('video,audio,.startText').forEach(el=>{try{el.pause()}catch(e){};el.remove()})}
function addAudio(src){const a=document.createElement('audio');a.src=src;a.autoplay=true;a.preload='auto';a.volume=1;document.getElementById('slide').appendChild(a);a.play().catch(()=>{});return a}
function addVideo(m,n){const box=document.getElementById('slide'),v=document.createElement('video');v.className='vid';v.src=m.src;v.playsInline=true;v.preload='auto';v.style.left=m.left+'%';v.style.top=m.top+'%';v.style.width=m.width+'%';v.style.height=m.height+'%';v.volume=1;
 if(ANSWER_SLIDES.has(n)){v.autoplay=false;v.muted=true;v.classList.add('hidden');const freeze=()=>{const t=Math.max(0,(v.duration||0)-0.08);try{v.currentTime=t}catch(e){}};v.addEventListener('loadedmetadata',freeze,{once:true});v.addEventListener('seeked',()=>{v.pause();v.classList.remove('hidden')},{once:true});box.appendChild(v);v.load();}
 else{v.autoplay=true;if(n===4)v.loop=true;box.appendChild(v);v.play().catch(()=>{});}return v}
function addStartOverlay(){const d=document.createElement('div');d.className='startText';d.innerHTML='<div class="main">НАЧИНАЕМ<b>!</b></div><div class="sub">Приготовьтесь угадывать</div>';document.getElementById('slide').appendChild(d)}
function show(n){if(n===current)return;current=n;clearMedia();const bg=document.getElementById('bg');bg.src='/static/presentation/slides/slide-'+pad(n)+'.jpg';(map[String(n)]||[]).forEach(m=>addVideo(m,n));if(n===4)addStartOverlay();if(TIMER_SLIDES.has(n))addAudio('/static/presentation/media/media18.mp4');if(ANSWER_SLIDES.has(n))addAudio('/static/presentation/media/media19.mp4');document.getElementById('hint').textContent=n+'/'+TOTAL}
async function init(){try{map=await(await fetch('/static/presentation/map.json',{cache:'no-store'})).json();preloadAll()}catch(e){}poll()}
async function poll(){try{const r=await fetch('/api/presentation?_='+Date.now(),{cache:'no-store'});const d=await r.json();show(d.slide)}catch(e){}finally{setTimeout(poll,200)}}init();
</script></body></html>
