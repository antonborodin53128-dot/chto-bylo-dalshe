<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Что было дальше? — Экран</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}.slide{position:relative;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);overflow:hidden;background:#000}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.vid{position:absolute;object-fit:fill;background:#000}.hint{position:fixed;right:12px;bottom:8px;color:#555;font:12px Arial;opacity:.35}</style></head><body><div id="stage"><div class="slide" id="slide"><img class="bg" id="bg"></div></div><div class="hint" id="hint"></div>
<script>
let current=0,map={};
fetch('/static/map.json',{cache:'no-store'}).then(r=>r.json()).then(x=>map=x);
function pad(n){return String(n).padStart(2,'0')}
function show(n){if(n===current)return;current=n;const box=document.getElementById('slide');box.querySelectorAll('video').forEach(v=>{try{v.pause()}catch(e){};v.remove()});document.getElementById('bg').src='/static/slides/slide-'+pad(n)+'.jpg';(map[String(n)]||[]).forEach(m=>{const v=document.createElement('video');v.className='vid';v.src=m.src;v.autoplay=true;v.playsInline=true;v.preload='auto';v.style.left=m.left+'%';v.style.top=m.top+'%';v.style.width=m.width+'%';v.style.height=m.height+'%';v.volume=1;box.appendChild(v);v.play().catch(()=>{});});document.getElementById('hint').textContent=n+'/40'}
async function poll(){try{const r=await fetch('/api/presentation?_='+Date.now(),{cache:'no-store'});const d=await r.json();show(d.slide)}catch(e){}finally{setTimeout(poll,200)}}poll();
</script></body></html>
